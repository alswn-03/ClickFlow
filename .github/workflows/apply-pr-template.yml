name: Apply PR Template

on:
  pull_request_target:
    types:
      - opened

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  apply-template:
    runs-on: ubuntu-latest

    steps:
      - name: Apply template based on branch and issue
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullRequest = context.payload.pull_request;

            const branchName = pullRequest.head.ref;

            /*
             * 지원하는 브랜치 형식
             *
             * feature/12-login-api
             * bug/13-login-error
             * bugfix/13-login-error
             * refactor/14-service-refactor
             * chore/15-docker-setting
             * study/16-docker-compose
             */
            const branchMatch = branchName.match(
              /^(feature|bug|bugfix|refactor|chore|study)\/(\d+)(?:-|\/|$)/i
            );

            if (!branchMatch) {
              core.notice(
                `브랜치명에서 PR 종류와 이슈 번호를 찾지 못했습니다: ${branchName}`
              );
              return;
            }

            let type = branchMatch[1].toLowerCase();
            const issueNumber = Number(branchMatch[2]);

            if (type === "bugfix") {
              type = "bug";
            }

            const templateMap = {
              feature: "feature.md",
              bug: "bug.md",
              refactor: "refactor.md",
              chore: "chore.md",
              study: "study.md"
            };

            const templateFile = templateMap[type];

            if (!templateFile) {
              core.setFailed(`지원하지 않는 PR 종류입니다: ${type}`);
              return;
            }

            // 실제 이슈가 존재하는지 확인
            try {
              await github.rest.issues.get({
                owner,
                repo,
                issue_number: issueNumber
              });
            } catch (error) {
              core.setFailed(`#${issueNumber} 이슈를 찾을 수 없습니다.`);
              return;
            }

            // 기본 브랜치에 있는 PR 템플릿 읽기
            const templateResponse = await github.rest.repos.getContent({
              owner,
              repo,
              path: `.github/PULL_REQUEST_TEMPLATE/${templateFile}`,
              ref: pullRequest.base.ref
            });

            if (Array.isArray(templateResponse.data)) {
              core.setFailed(`${templateFile}이 파일이 아닙니다.`);
              return;
            }

            const templateBody = Buffer.from(
              templateResponse.data.content,
              "base64"
            ).toString("utf8");

            const issueLink = `Closes #${issueNumber}`;

            // 기존 PR 본문이 있으면 맨 아래에 보존
            const existingBody = pullRequest.body?.trim();

            let newBody = `${templateBody.trim()}\n\n---\n\n${issueLink}`;

            if (existingBody) {
              newBody += `\n\n---\n\n## 기존 작성 내용\n\n${existingBody}`;
            }

            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: pullRequest.number,
              body: newBody
            });

            core.notice(
              `${templateFile}을 PR #${pullRequest.number}에 적용했습니다.`
            );
